<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -10 520 470">
<style>
*{transform-box:view-box}
.m-float{animation:flo 3.2s ease-in-out infinite}
.m-eyeL{transform-origin:160px 200px;animation:bli 4s infinite}
.m-eyeR{transform-origin:240px 200px;animation:bli 4s infinite}
.m-mouth{transform:scaleY(.55)}
.m-armR{transform-origin:272px 258px;transform:rotate(-12deg);animation:wav 2.4s ease-in-out infinite}
.m-armL{transform-origin:128px 258px;transform:rotate(12deg)}
.m-rec{animation:rec 1s steps(2) infinite}
@keyframes flo{50%{transform:translateY(-14px)}}
@keyframes bli{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wav{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-60deg)}}
@keyframes rec{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<radialGradient id="gb" cx="48%" cy="42%" r="62%"><stop offset="0" stop-color="#fffdf0"/><stop offset=".55" stop-color="#ffefb0"/><stop offset="1" stop-color="#ffd777"/></radialGradient>
<radialGradient id="gglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9b6bff" stop-opacity=".7"/><stop offset=".55" stop-color="#4f7cff" stop-opacity=".28"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/></radialGradient>
<linearGradient id="gscr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#9b6bff"/></linearGradient>
<linearGradient id="gph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2060"/><stop offset="1" stop-color="#0d0a22"/></linearGradient>
<filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="bl2"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<ellipse class="m-glow" cx="200" cy="215" rx="270" ry="260" fill="url(#gglow)"/>
<g class="m-float">
