   <g class="m-eyeL"><ellipse cx="160" cy="200" rx="19" ry="26" fill="#1b1245"/><ellipse cx="166" cy="190" rx="7.5" ry="9" fill="#fff"/><circle cx="153" cy="210" r="3.4" fill="#fff" opacity=".8"/></g>
