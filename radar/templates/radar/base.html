{% load static %}<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EstelarIA{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22none%22 stroke=%22%23EBFF6F%22 stroke-width=%222%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%224%22 fill=%22%23EBFF6F%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'radar/app.css' %}">
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
{% block extra_head %}{% endblock %}
</head>
<body>
<header class="site-header">
  <a class="logo" href="/" aria-label="EstelarIA">Estelar<span class="logo-ia">IA</span></a>
  <nav>
    <a href="/" {% block nav_radar %}{% endblock %}>Radar</a>
    <a href="/analizar/" {% block nav_analizar %}{% endblock %}>Analizar</a>
    <a href="/como-funciona/" {% block nav_como %}{% endblock %}>Cómo funciona</a>
  </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <span>Datos públicos · sin login · sin datos personales</span>
  <a href="https://github.com/P1p2gamer26/radar-30x" target="_blank" rel="noopener noreferrer">Ver el repositorio</a>
</footer>

<script>
// pestañas de guiones y botones "Copiar" (sin innerHTML)
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab]');
  if (t) {
    var box = t.closest('[data-tabs]');
    box.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b === t); });
    box.querySelectorAll('.tab-pane').forEach(function (p) { p.hidden = p.id !== t.dataset.tab; });
    return;
  }
  var c = e.target.closest('[data-copy]');
  if (c) {
    var txt = document.getElementById(c.dataset.copy).textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { c.textContent = 'Copiado'; }, function () { c.textContent = 'No se pudo copiar'; });
  }
});
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
